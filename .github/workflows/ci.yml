name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a PR stacked on another PR's branch
  # (#826 on feat/token-plugins) needs the same checks as one against main (#830).
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Supported range per package.json engines (>=22): the 22 LTS floor and
        # the current 24 "Krypton" LTS. (20 is below the engine floor.)
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install --include=optional --ignore-scripts
          npm rebuild

      # MUST run before Build: `prebuild` regenerates connect/version.ts from
      # package.json, so any check placed after Build inspects the regenerated file and
      # can never catch a committed-stale SDK_VERSION. A stale one makes the handshake
      # advertise the wrong sdkVersion and any wallet with a minSdkVersion floor answers
      # UNSUPPORTED_PROTOCOL_VERSION 4007 — a failure nobody traces back to a generated
      # constant.
      - name: Verify connect/version.ts matches package.json
        run: npm run verify:version

      - name: Typecheck
        run: npm run typecheck

      # Tests were excluded from `typecheck` (`**/*.test.ts`), so 332 type errors
      # had accumulated unseen — including doubles that no longer matched the
      # interface they stood in for. Kept separate from `typecheck` so a break
      # names which side it is on.
      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  # Mutation probes (#725): each probe re-applies a hand-verified money bug and
  # the named payments-v2 suite must go RED — a probe that stays green is a
  # hollow test and fails the job. Runner: scripts/test-mutation.mjs over
  # tests/mutation/probes.json.
  # Sharded: the runner edits source in place, so probes cannot share a checkout. Each job applies
  # every 8th probe in its own; together they cover the manifest once.
  mutation-shard:
    name: test-mutation shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --include=optional --ignore-scripts
          npm rebuild

      - name: Mutation probes
        run: npm run test:mutation
        env:
          MUTATION_SHARD: ${{ matrix.shard }}/8

      # Each shard records its own outcome, failed or not; a rerun of one shard replaces only its own.
      - name: Record this shard's result
        if: always()
        run: echo "${{ job.status }}" > mutation-shard-${{ matrix.shard }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutation-shard-${{ matrix.shard }}.txt
          overwrite: true

  # One result for the whole manifest, read from every shard's own record rather than the matrix
  # result, which a successful rerun of one failed shard can turn green while another still failed.
  # A missing record fails too.
  test-mutation:
    runs-on: ubuntu-latest
    needs: mutation-shard
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          merge-multiple: true

      - name: Every shard killed every probe
        run: |
          for shard in 1 2 3 4 5 6 7 8; do
            result=$(cat "mutation-shard-$shard.txt" 2>/dev/null || echo 'no result')
            echo "shard $shard/8: $result"
            test "$result" = success || failed=1
          done
          test -z "$failed"
