name: CI

on:
  push:
    branches: [main, feat/wallet-api-integration, feat/payments-v2]
  pull_request:
    branches: [main, feat/wallet-api-integration, feat/payments-v2]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Supported range per package.json engines (>=22): the 22 LTS floor and
        # the current 24 "Krypton" LTS. (20 is below the engine floor.)
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install --include=optional --ignore-scripts
          npm rebuild

      # MUST run before Build: `prebuild` regenerates connect/version.ts from
      # package.json, so any check placed after Build inspects the regenerated file and
      # can never catch a committed-stale SDK_VERSION. A stale one makes the handshake
      # advertise the wrong sdkVersion and any wallet with a minSdkVersion floor answers
      # UNSUPPORTED_PROTOCOL_VERSION 4007 — a failure nobody traces back to a generated
      # constant.
      - name: Verify connect/version.ts matches package.json
        run: npm run verify:version

      - name: Typecheck
        run: npm run typecheck

      # Tests were excluded from `typecheck` (`**/*.test.ts`), so 332 type errors
      # had accumulated unseen — including doubles that no longer matched the
      # interface they stood in for. Kept separate from `typecheck` so a break
      # names which side it is on.
      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  # Mutation probes (#725): each probe re-applies a hand-verified money bug and
  # the named payments-v2 suite must go RED — a probe that stays green is a
  # hollow test and fails the job. Runner: scripts/test-mutation.mjs over
  # tests/mutation/probes.json.
  test-mutation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install --include=optional --ignore-scripts
          npm rebuild

      - name: Mutation probes
        run: npm run test:mutation
